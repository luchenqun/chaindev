      operationId: Params
      summary: Parameters queries the parameters of the challenge module.
      responses:
        "200":
          description: A successful response.
          schema:
            type: object
  /moca/challenge/attested_challenge:
    get:
      tags:
        - moca.challenge
      operationId: AttestedChallenge
      summary: Queries the attested challenge by challenge id.
      parameters:
